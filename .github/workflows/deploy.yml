name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            run_tests:
                description: Run test suite before deploying
                type: boolean
                default: true
    repository_dispatch:
        types: [on-millennium-sdk-updated]

permissions:
    checks: write
    contents: read
    pull-requests: write

jobs:
    build_test_and_deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Authenticate SteamBrew
              run: |
                  printf '%s\nDB_PATH=/home/ubuntu/net/storage/steambrew/steambrew.db\nPLUGINS_DIR=/home/ubuntu/net/storage/steambrew/plugins\n' "$BEARER" > ./steambrew/www/.env
              env:
                  BEARER: ${{ secrets.BEARER }}

            - name: Install and build docs
              working-directory: steambrew/docs
              run: bun install --frozen-lockfile && bun run build

            - name: Install www dependencies
              working-directory: steambrew/www
              run: bun install --frozen-lockfile

            - name: Build www
              working-directory: steambrew/www
              run: bun run build

            - name: Fix native module symlinks
              working-directory: steambrew/www
              run: |
                  for link in .next/node_modules/*; do
                    if [ -L "$link" ]; then
                      name=$(basename "$link")
                      pkg=$(echo "$name" | sed -E 's/-[0-9a-f]{16}$//')
                      ln -sfn "../../node_modules/$pkg" "$link"
                    fi
                  done

            - name: Install Playwright browsers
              if: ${{ inputs.run_tests != false }}
              working-directory: steambrew/www
              run: bunx playwright install --with-deps chromium

            - name: Start production server
              if: ${{ inputs.run_tests != false }}
              working-directory: steambrew/www
              run: bun run start &
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Wait for server
              if: ${{ inputs.run_tests != false }}
              run: until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done
              timeout-minutes: 2

            - name: Run tests
              if: ${{ inputs.run_tests != false }}
              working-directory: steambrew/www
              run: bun run test

            - name: Upload Playwright report
              if: ${{ inputs.run_tests != false && always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: steambrew/www/playwright-report/
                  retention-days: 7

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add server to known hosts
              run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Sync www
              run: |
                  rsync -az --copy-links --delete \
                    steambrew/www/.next steambrew/www/public steambrew/www/package.json steambrew/www/.env steambrew/www/node_modules \
                    ubuntu@${{ secrets.SSH_HOST }}:~/net/steambrew/www/

            - name: Sync docs
              run: |
                  rsync -az --delete \
                    steambrew/docs/.vitepress/dist/ \
                    ubuntu@${{ secrets.SSH_HOST }}:~/net/steambrew/docs/

            - name: Swap
              run: |
                  ssh ubuntu@${{ secrets.SSH_HOST }} "bash ~/net/steambrew/swap.sh"
